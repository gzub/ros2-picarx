robot_hat_interface:
  controller_manager:
    ros__parameters:
      update_rate: 30 # [Hz]

  joint_state_broadcaster:
    ros__parameters:
      type: joint_state_broadcaster/JointStateBroadcaster

  forward_command_controller:
    ros__parameters:
      type: forward_command_controller/ForwardCommandController
      command_interfaces:
        - velocity
      joints:
        - left_wheel_joint
        - right_wheel_joint
        - steering_servo_joint