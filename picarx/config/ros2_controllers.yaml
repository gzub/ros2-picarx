controller_manager:
  ros__parameters:
    update_rate: 24
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 0.5
    steering_joints_names: ["left_steer_joint", "right_steer_joint"]
    traction_joints_names: ["left_rear_axle", "right_rear_axle"]
    wheelbase: 1.0 # Set to your robot's wheelbase in meters
    track: 1.5 # Set to your robot's track width in meters
    velocity_rolling_window_size: 10
    publish_rate: 24
    traction_wheels_radius: 0.3175 # <-- Set to half your rear_wheel_diameter
    open_loop: true
    enable_odom_tf: true
    base_frame_id: "base_link"
joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false
